name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Run all tests
        run: node tests/run-tests.js

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check if version already published
        id: check-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "prompt-optimizer-skill@${VERSION}" version 2>/dev/null; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "⚠️  Version ${VERSION} already exists on npm — skipping publish"
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish to npm
        if: steps.check-version.outputs.already_published != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ''

  github-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check if release already exists
        id: check-release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if gh release view "v${VERSION}" 2>/dev/null; then
            echo "already_exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  Release v${VERSION} already exists — skipping"
          else
            echo "already_exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version and previous tag
        if: steps.check-release.outputs.already_exists != 'true'
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          # Get previous tag for compare URL
          PREV=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          echo "PREV_TAG=${PREV}" >> $GITHUB_OUTPUT

      - name: Extract changelog
        if: steps.check-release.outputs.already_exists != 'true'
        id: changelog
        run: |
          CHANGELOG_BODY=$(node scripts/extract-changelog.js "${{ steps.version.outputs.VERSION }}")
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check-release.outputs.already_exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            **Install**: `npx prompt-optimizer-skill@${{ steps.version.outputs.VERSION }} "your prompt"`
            **Claude Code**: `/plugin install prompt-optimizer@${{ steps.version.outputs.VERSION }}`
            **Full Changelog**: https://github.com/dreamor/prompt-optimizer-skill/compare/v${{ steps.version.outputs.PREV_TAG }}...v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
