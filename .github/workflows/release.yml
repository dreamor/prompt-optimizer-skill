name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Run all tests
        run: node tests/run-tests.js

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ''

  github-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version and previous tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          # Get previous tag for compare URL
          PREV=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          echo "PREV_TAG=${PREV}" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: node -e "
          const f = require('fs').readFileSync('CHANGELOG.md','utf-8');
          const v = '${{ steps.version.outputs.VERSION }}';
          const m = f.match(new RegExp('## \\\\['+v+'\\\\][^#]+'));
          const body = m ? m[0].replace(/^##[^\\n]*\\n*/,'').trim() : '';
          require('fs').writeFileSync(process.env.GITHUB_OUTPUT, 'CHANGELOG<<EOF\n'+body+'\nEOF\n', {flag:'a'});
        "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            **Install**: `npx prompt-optimizer-skill@${{ steps.version.outputs.VERSION }} "your prompt"`
            **Claude Code**: `/plugin install prompt-optimizer@${{ steps.version.outputs.VERSION }}`
            **Full Changelog**: https://github.com/dreamor/prompt-optimizer-skill/compare/v${{ steps.version.outputs.PREV_TAG }}...v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
